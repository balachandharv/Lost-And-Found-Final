# ===================================================================
# Lost and Found Backend - Spring Boot Configuration
# ===================================================================

# Server Configuration
server.port=5000

# Application Name
spring.application.name=lost-and-found-backend

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# IMPORTANT: Update these values with your MySQL credentials before running
spring.datasource.url=jdbc:mysql://localhost:3306/lost_and_found_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=BALARAMA007@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# JWT Configuration
# ===================================================================
jwt.secret=lostfound-secret-key-2026-spring-boot-version-very-secure-key-minimum-256-bits
jwt.expiration=86400000

# ===================================================================
# Email Configuration (Gmail SMTP)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=balachandhar021@gmail.com
spring.mail.password=YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP Configuration
app.otp.expiry-minutes=5
app.otp.length=6

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=http://localhost:3000

# ===================================================================
# Allowed Users Configuration
